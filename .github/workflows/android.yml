name: Build Android APK
# يبني تطبيقًا مستقلًا لكل «تطبيق ملصقات» معرّف في لوحة المدير (img/stickers/catalog.json في موقع مشكاة):
# ملصقات مشكاة (أ) ← mishkat-stickers.apk ، (ب) ← mishkat-stickers-b.apk ، (ج) ← mishkat-stickers-c.apk …
on:
  push: {branches: [main]}
  release: {types: [published]}
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.l.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - name: List sticker apps from the Mishkat site catalog
        id: l
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/mishkatapps/mishkatapps.github.io.git site
          cd site && git sparse-checkout set --no-cone /img/stickers/catalog.json && cd ..
          pip install --quiet pillow
          APPS=$(python3 scripts/build-app.py site/img/stickers --list)
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"; echo "Apps: $APPS"

  apk:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from the latest release
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ github.event.release.tag_name }}'}
        run: |
          VER="$TAG"
          [ -n "$VER" ] || VER=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          VER="${VER#v}"; VER="${VER#V}"
          [ -n "$VER" ] || VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> "$GITHUB_ENV"
          grep -rl 'class="appver"' www | xargs -r sed -i -E "s#<span class=\"appver\">[^<]*</span>#<span class=\"appver\">$VER</span>#g"
          echo "App version: $VER"
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Use fixed signing key (updates install over old version)
        env: {KS: '${{ secrets.ANDROID_DEBUG_KEYSTORE }}'}
        run: |
          if [ -z "$KS" ]; then echo "::warning::ANDROID_DEBUG_KEYSTORE secret is missing - APK will use a temporary key"; exit 0; fi
          for d in "$HOME/.android" "${ANDROID_USER_HOME:-}" "${ANDROID_PREFS_ROOT:-}"; do
            [ -n "$d" ] || continue; mkdir -p "$d"; echo "$KS" | base64 -d > "$d/debug.keystore"
          done
      - name: Build this app's stickers and packs from the Mishkat site
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/mishkatapps/mishkatapps.github.io.git site
          cd site && git sparse-checkout set img/stickers && cd ..
          pip install --quiet pillow
          python3 scripts/build-app.py site/img/stickers "${{ matrix.app }}"
          rm -rf site
          node scripts/apply-app.js
          echo "APK=$(node -p "require('./app.json').apk")" >> "$GITHUB_ENV"
      - run: npm install
      - run: npx cap add android
      - name: Set Android version (shown in phone settings)
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" $G
          grep -E "applicationId|versionCode|versionName" $G
      - name: Generate icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B1D3F' --splashBackgroundColor '#0B1D3F'
        continue-on-error: true
      - run: npx cap sync android
      - name: WhatsApp stickers native setup (provider + plugin)
        run: node scripts/wa-native.js && grep -n "StickerContentProvider\|whatsapp" android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
      - uses: actions/upload-artifact@v4
        with: {name: 'apk-${{ matrix.app }}', path: '${{ env.APK }}'}
      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with: {files: '${{ env.APK }}', tag_name: '${{ github.event.release.tag_name }}'}
